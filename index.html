<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabeltrainer Englisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EEF1F3;
  --card:#FFFFFF;
  --ink:#16232B;
  --ink-soft:#5A6B75;
  --rule:#D6DCE0;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 64px}

.masthead{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;letter-spacing:-.01em}
.masthead .sub{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft)}

.intro{color:var(--ink-soft);font-size:14.5px;margin:18px 0 28px;max-width:56ch}

.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px 18px;margin-bottom:14px;
  border-left:5px solid var(--unit,#5A6B75);
  transition:border-color .15s, box-shadow .15s;
}
.card:hover{box-shadow:0 2px 10px rgba(22,35,43,.08)}
.card .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card .name{font-family:var(--serif);font-weight:600;font-size:19px}
.card .meta{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-soft);
  text-transform:uppercase;white-space:nowrap}
.card .desc{color:var(--ink-soft);font-size:13.5px;margin-top:4px}

.foot{margin-top:36px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);
  text-align:center;letter-spacing:.03em}
</style>
<link rel="stylesheet" href="assets/learning.css?v=20260918-bili-menue">
<link rel="stylesheet" href="assets/menu-preview.css?v=20260918-bili-menue">
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Vokabeltrainer <span class="title-accent">Englisch</span></h1>
    <div class="sub">Jahrgangs- und stufenbezogen</div>
  </div>

  <div id="cards"></div>
  <div id="bili"></div>

  <div class="foot">Vokabeltrainer Englisch</div>
</div>

<script>
/* =========================================================================
   SEITEN
   Jeder Eintrag ist eine eigene, unabhaengige Seite in ihrem eigenen
   Unterordner. Neue Seite hinzufuegen: Ordner mit index.html anlegen,
   hier ein Objekt ergaenzen. Sonst ist nichts zu tun.
   Farbcodes sind bewusst frei waehlbar, nur zur optischen Unterscheidung.
   ========================================================================= */
const SITES = [
  {
    "path": "year5/",
    "name": "Year 5",
    "meta": "Orientierungsstufe",
    "desc": "Vokabular zum Lehrwerk der 5. Klasse.",
    "color": "#2459A6"
  },
  {
    "path": "year6/",
    "name": "Year 6",
    "meta": "Orientierungsstufe",
    "desc": "Vokabular zum Lehrwerk der 6. Klasse.",
    "color": "#AC2865"
  },
  {
    "path": "year7/",
    "name": "Year 7",
    "meta": "Mittelstufe",
    "desc": "Vokabular zum Lehrwerk der 7. Klasse.",
    "color": "#7448A3"
  },
  {
    "path": "year8/",
    "name": "Year 8",
    "meta": "Mittelstufe",
    "desc": "Vokabular zum Lehrwerk der 8. Klasse.",
    "color": "#007C83"
  },
  {
    "path": "year9/",
    "name": "Year 9",
    "meta": "Mittelstufe",
    "desc": "Vokabular zum Lehrwerk der 9. Klasse.",
    "color": "#B5482A"
  },
  {
    "path": "year10/",
    "name": "Year 10",
    "meta": "Mittelstufe",
    "desc": "Vokabular zum Lehrwerk der 10. Klasse.",
    "color": "#357341"
  },
  {
    "path": "oberstufe/",
    "name": "Oberstufe",
    "meta": "E-Jahrgang – Q2",
    "desc": "Vokabular zu den Korridorthemen der gymnasialen Oberstufe.",
    "color": "#193F50"
  }
];

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

const MENU_ART = {
 'year5/':'M8 68H72M13 68V34H27M53 34H67V68M27 68V27L40 16L53 27V68M35 68V53H45V68M40 16V6H53V13H40M18 43H22M18 53H22M58 43H62M58 53H62M35 35H45V44H35Z',
 'year6/':'M56 40A16 16 0 1 0 24 40A16 16 0 1 0 56 40M40 7V16M40 64V73M7 40H16M64 40H73M17 17L23 23M57 57L63 63M17 63L23 57M57 23L63 17',
 'year7/':'M24 73H56M28 73V28H52V73M25 28H55L49 20H31ZM33 20L40 7L47 20M40 7V3M48 39A8 8 0 1 0 32 39A8 8 0 1 0 48 39M40 34V39L44 42M34 53V65M40 53V65M46 53V65M27 49H53',
 'year8/':'M7 18L18 21L30 22L40 22L42 18L47 20L48 26L52 25L55 28L60 26L63 21L67 21L70 15L73 18L71 26L66 30L65 36L60 42L57 45L57 52L61 61L59 66L54 62L51 53L45 51L40 53L35 51L32 57L28 55L24 47L18 45L14 43L10 36L6 28Z',
 'year9/':'M7 66Q23 62 29 47Q31 40 40 36L47 27L47 16L51 7L54 21L61 12L59 26L68 31L66 35L57 36L51 45L58 49L65 46M51 45L46 52Q57 58 55 64L68 69L51 70L40 60L33 69H22L32 59L32 51Q22 66 7 66ZM61 30L61 30',
 'year10/':'M48 28A8 8 0 1 0 32 28A8 8 0 1 0 48 28M23 37A6 6 0 1 0 11 37A6 6 0 1 0 23 37M69 37A6 6 0 1 0 57 37A6 6 0 1 0 69 37M27 58V50Q27 40 40 40Q53 40 53 50V58ZM8 59V53Q8 46 17 46H22M58 46H63Q72 46 72 53V59M14 22Q40 0 66 22M15 67Q40 80 65 67',
 'oberstufe/':'M8 29L40 12L72 29L40 46ZM20 36V54Q40 68 60 54V36M72 29V55'
};
function menuArt(path){return '<svg class="menu-art" aria-hidden="true" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="'+MENU_ART[path]+'"/></svg>';}
/* =========================================================================
   BILINGUALER UNTERRICHT
   Eigener Bereich unterhalb der Jahrgaenge, weil die Sachfaecher quer zu
   den Jahrgangsstufen liegen. Aufklappbar, damit die Startseite kurz
   bleibt. Sobald eine Jahrgangsstufe eigenes Vokabular hat, bekommt sie
   hier ein "path" - dann wird aus dem Eintrag automatisch ein Link.
   ========================================================================= */
const BILI = {
  "name": "Bilingualer Unterricht",
  "meta": "Sachfachvokabular",
  "color": "#6B4226",
  "subjects": [
    {
      "id": "wipo",
      "name": "WiPo",
      "meta": "Wirtschaft/Politik",
      "color": "#9A5B12",
      "levels": [
        {"name": "WiPo Bili E-Jahrgang", "meta": "Einf\u00fchrungsphase"},
        {"name": "WiPo Bili Q1", "meta": "Qualifikationsphase"},
        {"name": "WiPo Bili Q2", "meta": "Qualifikationsphase"}
      ]
    },
    {
      "id": "history",
      "name": "History",
      "meta": "Geschichte",
      "color": "#6D3B6E",
      "levels": [
        {"name": "History Year 9", "meta": "Mittelstufe"},
        {"name": "History Year 10", "meta": "Mittelstufe"}
      ]
    },
    {
      "id": "geography",
      "name": "Geography",
      "meta": "Geographie",
      "color": "#2E6B4F",
      "levels": [
        {"name": "Geography Year 7", "meta": "Mittelstufe"},
        {"name": "Geography Year 8", "meta": "Mittelstufe"},
        {"name": "Geography Year 9", "meta": "Mittelstufe"},
        {"name": "Geography Year 10", "meta": "Mittelstufe"}
      ]
    }
  ]
};

const BILI_ART = {
 'bili':'M8 16H44V40H24L14 50V40H8ZM36 30H72V54H56V66L44 54H36Z',
 'wipo':'M10 68H70M18 68V48H28V68M34 68V32H44V68M50 68V40H60V68M14 38L26 26L38 32L58 12M48 12H60V24',
 'history':'M8 30L40 12L72 30M8 66H72M13 60H67M16 30V60M28 30V60M40 30V60M52 30V60M64 30V60',
 'geography':'M40 8A32 32 0 1 0 40 72A32 32 0 1 0 40 8M8 40H72M40 8Q24 40 40 72M40 8Q56 40 40 72'
};
function biliArt(key){
  return '<svg class="bili-art" aria-hidden="true" viewBox="0 0 80 80" fill="none" stroke="currentColor" '
    + 'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="' + BILI_ART[key] + '"/></svg>';
}
const biliOpen = new Set();
function biliLevel(level){
  const label = '<span class="bili-level-text"><span class="bili-level-name">' + esc(level.name) + '</span>'
    + '<span class="bili-level-meta">' + esc(level.meta || "") + '</span></span>';
  return level.path
    ? '<a class="bili-level" href="' + esc(level.path) + '">' + label
      + '<span class="bili-level-go" aria-hidden="true">\u2192</span></a>'
    : '<div class="bili-level is-pending">' + label
      + '<span class="bili-pill">In Vorbereitung</span></div>';
}
function renderBili(){
  const box = document.getElementById("bili");
  const open = biliOpen.has('bili');
  box.innerHTML = '<h2 class="bili-heading">' + esc(BILI.name) + '</h2>'
    + '<div class="bili-acc" style="--unit:' + esc(BILI.color) + '">'
    + '<button type="button" class="bili-head" data-bili="bili" aria-expanded="' + open + '">'
    + biliArt('bili') + '<span class="bili-name">' + esc(BILI.name) + '</span>'
    + '<span class="bili-meta">' + esc(BILI.meta) + '</span>'
    + '<span class="bili-chev" aria-hidden="true">\u203a</span></button>'
    + (open ? '<div class="bili-body">' + BILI.subjects.map(function(subject){
        const subjectOpen = biliOpen.has(subject.id);
        return '<div class="bili-acc" style="--unit:' + esc(subject.color) + '">'
          + '<button type="button" class="bili-head" data-bili="' + esc(subject.id) + '" aria-expanded="' + subjectOpen + '">'
          + biliArt(subject.id) + '<span class="bili-name">' + esc(subject.name) + '</span>'
          + '<span class="bili-meta">' + esc(subject.meta) + '</span>'
          + '<span class="bili-chev" aria-hidden="true">\u203a</span></button>'
          + (subjectOpen ? '<div class="bili-body"><div class="bili-levels">'
              + subject.levels.map(biliLevel).join("") + '</div></div>' : '')
          + '</div>';
      }).join("") + '</div>' : '')
    + '</div>';
  box.querySelectorAll('[data-bili]').forEach(function(button){
    button.onclick = function(){
      const id = button.dataset.bili;
      if(biliOpen.has(id)) biliOpen.delete(id); else biliOpen.add(id);
      renderBili();
    };
  });
}

function render(){
  const box = document.getElementById("cards");
  box.innerHTML = SITES.map(s => `
    <a class="card" style="--unit:${esc(s.color || "#5A6B75")}" href="${esc(s.path)}">
      ${menuArt(s.path)}<span class="menu-arrow" aria-hidden="true">→</span>
      <div class="row">
        <span class="name">${esc(s.name)}</span>
        <span class="meta">${esc(s.meta || "")}</span>
      </div>
      <div class="desc">${esc(s.desc || "")}</div>
    </a>
  `).join("");
}
render();
renderBili();
</script>
</body>
</html>
