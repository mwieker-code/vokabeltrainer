<!DOCTYPE html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irregular Verbs – Orientierungs- und Mittelstufe</title>
<script>
/* Faengt Fehler ab, die sonst zu einer leeren Seite fuehren, und zeigt sie an. */
window.onerror = function(msg, src, line, col){
  try{
    var box = document.getElementById("warn");
    if(!box){
      box = document.createElement("div");
      box.id = "warn";
      document.body.insertBefore(box, document.body.firstChild);
    }
    box.innerHTML = '<div class="warn"><b>Diese Seite laeuft in deinem Browser nicht.</b><br>'
      + 'Wahrscheinlich ist er zu alt fuer eine der verwendeten Funktionen. '
      + 'Bitte diesen Text weitergeben:<br><span style="font-family:monospace;font-size:11px">'
      + String(msg) + ' (Zeile ' + line + ':' + col + ')</span></div>';
  }catch(e){}
  return false;
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
:root{
  --ground:#EEF1F3;
  --card:#FFFFFF;
  --ink:#16232B;
  --ink-soft:#5A6B75;
  --rule:#D6DCE0;
  --petrol:#0E5A66;
  --amber:#C9761E;
  --rust:#A8382A;
  --moss:#3F7A4B;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 64px}

/* ---------- Kopfzeile ---------- */
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:28px;flex-wrap:wrap}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em}
.masthead .sub{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft)}
.masthead .logo{height:38px;width:auto;flex:0 0 auto;align-self:center}
@media(max-width:560px){ .masthead .logo{height:30px} }
@media print{ .masthead .logo{height:32px} }

/* ---------- Startseite ---------- */
.yeargroup{margin-bottom:34px}
.yearhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.yearhead .tag{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--ground);
  padding:2px 7px;border-radius:2px}
.yearhead .name{font-family:var(--serif);font-size:17px;font-style:italic;color:var(--ink-soft)}

.topic{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--rule);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;
  cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.topic:hover{border-left-color:var(--petrol);transform:translateX(2px)}
.topic:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.topic .t-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.topic .t-name{font-weight:500}
.topic .t-count{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.topic .t-due{color:var(--amber)}
.bar{height:6px;background:var(--rule);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--petrol);border-radius:3px;
  transition:width .35s ease}
.bar i.full{background:var(--moss)}
.t-prog{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);
  margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.seal{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--moss);border:1px solid var(--moss);border-radius:2px;padding:1px 5px;
  white-space:nowrap}

/* ---------- Serie ---------- */
.streak{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:12px 14px;margin-bottom:16px;flex-wrap:wrap}
.streak .big{font-family:var(--serif);font-size:23px;line-height:1.1}
.streak .lab{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft)}
.streak .flame{font-size:15px;line-height:1;color:var(--moss)}
.streak.cold .big{color:var(--ink-soft)}
.streak .right{text-align:right}

/* ---------- Abzeichen ---------- */
.badges{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:13px 14px;margin-bottom:16px}
.badges h3{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 9px;font-weight:400}
.badgegrid{display:flex;flex-wrap:wrap;gap:7px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);
  border-radius:2px;padding:4px 8px;font-size:12.5px;color:var(--ink-soft);background:var(--ground)}
.badge.on{border-color:var(--moss);color:var(--ink);background:#EDF4EE}
.badge .m{font-family:var(--mono);font-size:11px}

/* ---------- Bestaetigung Fach 5 ---------- */
.toast{background:#EDF4EE;border:1px solid var(--moss);border-radius:var(--r);
  padding:9px 12px;margin-bottom:12px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.toast .m{font-family:var(--serif);font-size:15px}
@media print{ .streak,.badges,.toast{display:none} }
.minirail{display:flex;gap:2px;margin-top:9px}
.minirail i{height:4px;flex:1;background:var(--rule);border-radius:1px}
.minirail i.f{background:var(--petrol)}

.emptyhint{background:var(--card);border:1px dashed var(--rule);border-radius:var(--r);
  padding:14px 16px;color:var(--ink-soft);font-size:14px}

/* ---------- Sitzung: Leitner-Schiene (Signature) ---------- */
.rail{display:flex;gap:6px;margin-bottom:22px}
.slot{flex:1;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:7px 6px 6px;text-align:center;position:relative;transition:border-color .2s,background .2s}
.slot .n{font-family:var(--mono);font-size:10px;color:var(--ink-soft);letter-spacing:.06em}
.slot .c{font-family:var(--serif);font-size:19px;line-height:1.1;margin-top:1px}
.slot .iv{font-family:var(--mono);font-size:9px;color:var(--ink-soft);margin-top:2px}
.slot.here{border-color:var(--petrol);background:#E7F0F1}
.slot.here::after{content:"";position:absolute;left:50%;bottom:-7px;width:8px;height:8px;
  transform:translateX(-50%) rotate(45deg);background:#E7F0F1;
  border-right:1px solid var(--petrol);border-bottom:1px solid var(--petrol)}
.slot.land{animation:land .45s ease-out}
@keyframes land{0%{transform:translateY(-6px)}60%{transform:translateY(2px)}100%{transform:none}}

/* ---------- Karte ---------- */
.stage{position:relative}
.vcard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:30px 26px;min-height:250px;display:flex;flex-direction:column;
  box-shadow:0 1px 0 var(--rule),0 6px 22px rgba(22,35,43,.06)}
.vcard.deal{animation:deal .28s ease-out}
@keyframes deal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:20px}
.prompt{font-family:var(--serif);font-size:38px;line-height:1.15;letter-spacing:-.015em;margin:0}
.pos{font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:15px;margin-top:5px}
.phon{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.ipa{font-family:var(--mono);font-size:13px;color:var(--ink-soft);letter-spacing:.01em}
.speak{padding:5px 9px;line-height:0;border-color:var(--rule);color:var(--petrol)}
.speak:hover{border-color:var(--petrol);background:#E7F0F1}
.speak svg{width:15px;height:15px;display:block}
.speak.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
.answer{margin-top:20px;padding-top:18px;border-top:1px solid var(--rule)}
.answer .de{font-family:var(--serif);font-size:23px}
.answer .coll{font-size:13px;color:var(--ink-soft);margin-top:8px}
.answer .ex{font-family:var(--serif);font-style:italic;font-size:16px;margin-top:14px;
  padding-left:12px;border-left:2px solid var(--petrol);color:#31434D}
.answer .ex b{font-style:normal;font-weight:600;color:var(--ink);
  box-shadow:inset 0 -.42em 0 rgba(14,90,102,.14)}
.answer .ex .speak{margin-left:8px;vertical-align:middle;padding:4px 7px}
.answer .ex .speak svg{width:13px;height:13px}
.spacer{flex:1}

/* ---------- Bedienelemente ---------- */
.controls{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--rule);
  background:var(--card);color:var(--ink);padding:11px 15px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--ink-soft)}
button:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
button.primary{background:var(--petrol);border-color:var(--petrol);color:#fff;flex:1}
button.primary:hover{background:#0B4A54}
.rate{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px}
.rate span{font-family:var(--mono);font-size:10px;color:var(--ink-soft);letter-spacing:.05em}
.rate.again{border-color:var(--amber);color:var(--amber)}
.rate.again:hover{background:#FBF2E6}
.rate.hard{border-color:var(--ink-soft)}
.rate.hard:hover{background:#EEF1F3}
.rate.good{border-color:var(--moss);color:var(--moss)}
.rate.good:hover{background:#EDF4EE}

.opts{display:grid;gap:8px;margin-top:20px}
.opt{text-align:left;padding:13px 15px;font-family:var(--serif);font-size:17px}
.opt.right{border-color:var(--moss);background:#EDF4EE;color:var(--moss)}
.opt.wrong{border-color:var(--amber);background:#FBF2E6;color:var(--amber)}
.opt:disabled{cursor:default;opacity:1}

.typebox{margin-top:20px}
.typebox input{width:100%;font-family:var(--serif);font-size:22px;padding:12px 14px;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--ground);color:var(--ink)}
.typebox input:focus{outline:2px solid var(--petrol);outline-offset:1px;background:var(--card)}
.verdict{margin-top:12px;font-size:14px}
.verdict.ok{color:var(--moss)}
.verdict.near{color:var(--amber)}
.verdict.no{color:var(--rust);font-weight:600}
.verdict .mark{font-family:var(--mono);font-size:15px;margin-right:5px}
.verdict .yours{font-family:var(--serif);font-size:15px;color:var(--ink-soft);
  display:block;margin-top:3px;text-decoration:line-through;text-decoration-thickness:1px}
.verdict .sol{font-family:var(--serif);font-size:18px;color:var(--ink);display:block;margin-top:3px}

/* ---------- Kopf der Sitzung ---------- */
.sessionbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:18px;flex-wrap:wrap}
.linkbtn{background:none;border:none;padding:4px 0;color:var(--petrol);text-decoration:underline;
  text-underline-offset:3px}
.switches{display:flex;gap:6px;flex-wrap:wrap}
.switch{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:6px 9px;
  text-transform:uppercase}
.switch[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

/* ---------- Abschluss ---------- */
.done{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:34px 26px;text-align:center}
.done h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 8px}
.done p{color:var(--ink-soft);margin:0 0 20px}

/* ---------- Fußzeile ---------- */
.credit{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-soft)}
@media print{ .credit{display:none} }
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);
  display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.04em}
.foot button{padding:5px 9px;font-family:var(--mono);font-size:11px}
.warn{background:#FBF2E6;border:1px solid var(--amber);color:#8A4E12;border-radius:var(--r);
  padding:9px 12px;font-size:13px;margin-bottom:20px;line-height:1.4}

/* ---------- Anleitung ---------- */
.doc{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:26px 26px 30px;max-width:640px}
.doc h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:34px 0 8px;
  letter-spacing:-.01em}
.doc h2:first-child{margin-top:0}
.doc h3{font-family:var(--sans);font-weight:600;font-size:15px;margin:20px 0 5px}
.doc p{margin:0 0 12px;font-size:15px}
.doc ul{margin:0 0 12px;padding-left:20px;font-size:15px}
.doc li{margin-bottom:5px}
.doc .lead{color:var(--ink-soft)}
.doc code{font-family:var(--mono);font-size:12.5px;background:var(--ground);
  padding:1px 5px;border-radius:2px}
.doc table{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:14px}
.doc th,.doc td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule)}
.doc th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.doc td:first-child{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:3px;padding:1px 6px;background:var(--ground)}
.doc .warnbox{background:#FBF2E6;border:1px solid var(--amber);border-radius:var(--r);
  padding:12px 14px;font-size:14.5px;margin:0 0 14px;line-height:1.5}
.doc .teacher{border-top:2px solid var(--ink);margin-top:36px;padding-top:18px}
@media print{
  .doc{border:none;padding:0;max-width:none}
  .doc h2{page-break-after:avoid}
}

/* ---------- Lueckensatz ---------- */
.cloze{font-family:var(--serif);font-size:22px;line-height:1.55;margin:0}
.cloze .gap{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--petrol);
  text-align:center;color:var(--petrol);font-family:var(--mono);font-size:15px;
  vertical-align:baseline;padding:0 4px}
.cloze b{font-style:normal;font-weight:600;
  box-shadow:inset 0 -.42em 0 rgba(14,90,102,.18)}
.clue{font-family:var(--serif);font-size:16px;color:var(--ink-soft);margin-top:14px}
.clue span{color:var(--ink)}

/* ---------- Listenansicht ---------- */
.listctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.listctl input[type=search]{flex:1;min-width:180px;font:inherit;font-size:15px;
  padding:10px 13px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--card);color:var(--ink);-webkit-appearance:none}
.listctl input[type=search]:focus{outline:2px solid var(--petrol);outline-offset:1px}
.listcount{font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:16px}

.lsec{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  margin-bottom:8px;overflow:hidden}
.lsec > summary{cursor:pointer;padding:13px 15px;display:flex;justify-content:space-between;
  align-items:baseline;gap:12px;list-style:none;font-weight:500}
.lsec > summary::-webkit-details-marker{display:none}
.lsec > summary:hover{background:var(--ground)}
.lsec > summary .lyear{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  background:var(--ink);color:var(--ground);border-radius:2px;padding:2px 6px;margin-right:9px}
.lsec > summary .lnum{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.lsec[open] > summary{border-bottom:1px solid var(--rule)}
.lbody{padding:4px 15px 12px}

.vrow{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;
  padding:9px 0;border-bottom:1px solid var(--ground);break-inside:avoid}
.vrow:last-child{border-bottom:none}
.ven{font-family:var(--serif);font-size:16px}
.vipa{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin-left:7px;white-space:nowrap}
.vpos{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--ink-soft);margin-left:7px}
.vde{font-size:14.5px}
.vex{grid-column:1 / -1;font-family:var(--serif);font-style:italic;font-size:14px;
  color:#31434D;padding-left:11px;border-left:2px solid var(--rule);margin-top:3px}
.vlist.hide-ex .vex{display:none}
.vlist.hide-ipa .vipa{display:none}
.vrow.off{display:none}
.lsec.off{display:none}
.noresult{background:var(--card);border:1px dashed var(--rule);border-radius:var(--r);
  padding:14px 16px;color:var(--ink-soft);font-size:14px}

@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .masthead{border-bottom:1px solid #000;margin-bottom:14px}
  .sessionbar,.listctl,.foot,#warn,.listcount button{display:none!important}
  .lsec{border:none;border-radius:0;margin:0 0 6mm;page-break-inside:auto}
  .lsec + .lsec{page-break-before:always}
  .lsec > summary{padding:0 0 4px;border-bottom:1px solid #000;font-size:14pt}
  .lsec > summary .lnum{color:#000}
  .lbody{padding:6px 0 0;columns:2;column-gap:10mm}
  .vrow{grid-template-columns:1fr;gap:1px;padding:3px 0;
    border-bottom:none;page-break-inside:avoid}
  .ven{font-size:11pt}
  .vde{font-size:10pt;color:#333}
  .vipa{color:#555}
  .vex{font-size:9.5pt;border-left:1px solid #999}
}

@media(max-width:560px){
  .prompt{font-size:30px}
  .slot .c{font-size:16px}
  .slot .iv{display:none}
  .vcard{padding:22px 18px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- Verbformen: Karte ---------- */
.forms{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;margin-top:4px}
.forms .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);white-space:nowrap}
.forms .frm{font-family:var(--serif);font-size:26px;line-height:1.1}
.forms .frm .fipa{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
  display:block;margin-top:2px}
.forms .speak{justify-self:end}
.chain{margin-top:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  border-top:1px solid var(--rule);padding-top:14px}
.chain .cw{font-family:var(--serif);font-size:17px;color:var(--ink-soft)}

/* ---------- Zwei Eingabefelder ---------- */
.twoin{display:grid;gap:12px;margin-top:20px}
.twoin .fld label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:4px}
.twoin input{width:100%;font-family:var(--serif);font-size:21px;padding:11px 13px;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--ground);color:var(--ink)}
.twoin input:focus{outline:2px solid var(--petrol);outline-offset:1px;background:var(--card)}
.twoin input.ok{border-color:var(--moss);background:#EDF4EE}
.twoin input.near{border-color:var(--amber);background:#FBF2E6}
.twoin input.no{border-color:var(--rust);border-width:2px;background:#F8EBE9;
  color:var(--rust);text-decoration:line-through;text-decoration-thickness:1px}
.twoin .fld.no > label{color:var(--rust)}
.twoin .sol.no{color:var(--rust)}
.twoin .sol.no b{color:var(--rust)}
.shake{animation:shake .28s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)}
  75%{transform:translateX(4px)}
}
.twoin .sol{font-family:var(--serif);font-size:15px;color:var(--ink-soft);margin-top:4px}
.twoin .sol b{font-style:normal;color:var(--ink)}

/* ---------- Typ-Abzeichen ---------- */
.typebadge{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:2px;padding:2px 6px;color:var(--ink-soft)}
.pattern{font-family:var(--mono);font-size:12px;color:var(--petrol);margin-top:6px;letter-spacing:.04em}

/* ---------- Listenansicht: drei Spalten ---------- */
.vrow3{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px 14px;
  padding:8px 0;border-bottom:1px solid var(--ground);break-inside:avoid;align-items:baseline}
.vrow3:last-child{border-bottom:none}
.vrow3 .c1,.vrow3 .c2,.vrow3 .c3{font-family:var(--serif);font-size:15.5px}
.vrow3 .c2,.vrow3 .c3{color:#31434D}
.vrow3 .vde{font-size:14px}
.vrow3 .vipa{display:block;margin-left:0}
.vlist.hide-ipa .vipa{display:none}
.lhead{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;padding:6px 0;
  border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
@media(max-width:560px){
  .vrow3,.lhead{grid-template-columns:1fr 1fr}
  .forms .frm{font-size:22px}
}
@media print{
  .vrow3,.lhead{grid-template-columns:1fr 1fr 1fr 1fr;font-size:10pt}
  .lbody{columns:1}
}

var SUBJ = [

  {t:"the teacher", sg:true}, {t:"she", sg:true}, {t:"he", sg:true},

];
/* "be" braucht eigene Ergaenzungen, sonst steht dauernd "at home". */
var BE_PHR = ["at home","late for school","at the swimming pool","in the classroom",
              "tired after the trip","on the bus","at the dentist's","in the same team",
              "happy about the result","ready in time"];
var TIMEW = ["yesterday","last weekend","last night","on Monday","last summer",
             "after school","two weeks ago","last Friday","this morning",
             "during the holidays","on Sunday","last year"];

function pickOne(list){ return list[Math.floor(Math.random()*list.length)]; }

/* Baut eine Aufgabe: kind = "neg" oder "q". */
function buildNeg(v, kind){
  var isBe0 = (v.base === "be");
  var phrase = isBe0 ? pickOne(BE_PHR) : (PHR[v.base] || "");
  var subj = pickOne(SUBJ);
  var time = pickOne(TIMEW);
  var isBe = (v.base === "be");
  var rest = (phrase ? phrase + " " : "") + time;
  var cue, sentence, answers;

  if(kind === "neg"){
    cue = "not / " + v.base;
    sentence = subj.t + " ___ (" + cue + ") " + rest + ".";
    answers = isBe
      ? (subj.sg ? ["wasn't", "was not"] : ["weren't", "were not"])
      : ["didn't " + v.base, "did not " + v.base];
  }else{
    cue = subj.t + " / " + v.base;
    sentence = "___ (" + cue + ") " + rest + "?";
    answers = isBe
      ? (subj.sg ? ["was " + subj.t, "was " + subj.t]
                 : ["were " + subj.t, "were " + subj.t])
      : ["did " + subj.t + " " + v.base, "did " + subj.t + " " + v.base];
  }
  sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);
  /* In der Frage steht die Luecke am Satzanfang, also gross geschrieben. */
  var shown = (kind === "q") ? answers[0].charAt(0).toUpperCase() + answers[0].slice(1)
                             : answers[0];
  return {kind:kind, sentence:sentence, answers:answers, solution:shown,
          subj:subj, isBe:isBe};
}

/* Vergleich fuer diesen Modus: Grossschreibung und Apostrophform egal. */
function checkNeg(input, answers){
  var a = String(input).toLowerCase().trim()
            .replace(/[.?!]/g,"").replace(/[’´`]/g,"'").replace(/\s+/g," ");
  var i;
  for(i=0;i<answers.length;i++){ if(a === answers[i].toLowerCase()) return "ok"; }
  /* Fehlender Apostroph: als Fluechtigkeitsfehler behandeln. */
  var bare = function(x){ return x.replace(/'/g,""); };
  for(i=0;i<answers.length;i++){
    if(bare(a) === bare(answers[i].toLowerCase())) return "near";
  }

  /* "Fast" nur bei Tippfehlern. Ein falsches Hilfsverb (did statt didn't,
     was statt were) ist ein Grammatikfehler und zaehlt als falsch. */
  for(i=0;i<answers.length;i++){
    var want = answers[i].toLowerCase().split(" ");
    var got  = a.split(" ");
    if(got[0] !== want[0]) continue;
    if(distance(a, answers[i].toLowerCase()) <= 2) return "near";
  }
  return "no";
}

   pick:function(){ return true; }},

  /* Eigener Uebungstyp: Verneinung und Frage. Eigener Lernstand, damit er
     sich nicht mit dem Formentraining vermischt. */
  {id:"t-neg", group:"Grammatik", name:"Verneinung und Fragen im simple past",
   mode:"neg", suffix:"|neg",
   pick:function(v){ return !!PHR[v.base]; }}
];

var SETS = {};
TOPICS.forEach(function(t){
  var list = V.filter(t.pick);
  if(t.suffix){
    /* eigene Kennung, damit der Lernstand getrennt gefuehrt wird */
    list = list.map(function(v){
      var c = {}; for(var k in v){ if(v.hasOwnProperty(k)) c[k] = v[k]; }
      c.id = v.id + t.suffix;
      return c;
    });
  }
  SETS[t.id] = list;
});
function topicById(id){
  return TOPICS.filter(function(t){ return t.id === id; })[0];
}

   ========================================================================= */
var Store = (function(){
  var persistent = true, mem = {};
  try{ localStorage.setItem("iv:test","1"); localStorage.removeItem("iv:test"); }
  catch(e){ persistent = false; }
  return {
    persistent: persistent,
    get:function(k){
      try{ if(persistent) return localStorage.getItem(k); return (k in mem) ? mem[k] : null; }
      catch(e){ return (k in mem) ? mem[k] : null; }
    },
    set:function(k,v){
      try{ persistent ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; }
    }
  };
})();

var INTERVALS = [0,1,2,4,8,16];

/* -------------------------------------------------------------------------
   SERIE. Gezaehlt werden Kalendertage, an denen mindestens eine Karte
   bewertet wurde. Ein ausgelassener Tag setzt auf 1 zurueck - ohne Freischuss.
   ------------------------------------------------------------------------- */
var MKEY = "iv:meta";
var meta = (function(){
  var d = {streak:0, best:0, lastDay:"", today:0};
  try{
    var raw = JSON.parse(Store.get(MKEY));
    if(raw && typeof raw === "object"){
      d.streak = raw.streak || 0; d.best = raw.best || 0;
      d.lastDay = raw.lastDay || ""; d.today = raw.today || 0;
    }
  }catch(e){}
  return d;
})();
function saveMeta(){ Store.set(MKEY, JSON.stringify(meta)); }

function dayStamp(offset){
  var d = new Date();
  if(offset) d.setDate(d.getDate() + offset);
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}
/* Wer gestern zuletzt geuebt hat, behaelt die Serie noch bis Mitternacht. */
function streakNow(){
  if(meta.lastDay === dayStamp(0) || meta.lastDay === dayStamp(-1)) return meta.streak;
  return 0;
}
function todayCount(){ return meta.lastDay === dayStamp(0) ? meta.today : 0; }

function touchDay(){
  var today = dayStamp(0);
  if(meta.lastDay === today){ meta.today++; }
  else{
    meta.streak = (meta.lastDay === dayStamp(-1)) ? meta.streak + 1 : 1;
    meta.lastDay = today; meta.today = 1;
  }
  if(meta.streak > meta.best) meta.best = meta.streak;
  saveMeta();
}

/* Ein Set gilt als geschafft, wenn jedes Verb darin in Fach 5 liegt. */
function isMastered(topicId){
  var set = SETS[topicId];
  if(!set.length) return false;
  for(var i=0;i<set.length;i++){ if(rec(set[i].id).box !== 5) return false; }
  return true;
}

/* Der Lernstand haengt am Verb, nicht am Set. Ein Verb, das in Portion 1
   und im Muster-Set steckt, hat denselben Stand. */
function rec(vid){
  if(!progress[vid]) progress[vid] = {box:1, due:0};
  return progress[vid];
}
function isDue(r){ return Date.now() >= r.due; }
function boxCounts(topicId){
  var c=[0,0,0,0,0];
  SETS[topicId].forEach(function(v){ c[rec(v.id).box-1]++; });
  return c;
}
function dueCount(topicId){
  return SETS[topicId].filter(function(v){ return isDue(rec(v.id)); }).length;
}


/* =========================================================================
   AUSSPRACHE  –  Web Speech API des Browsers, keine externe Anbindung
   ========================================================================= */
var Speech = (function(){
  var synth = window.speechSynthesis;
  if(!synth) return {available:false, say:function(){}, status:function(){ return "nicht unterstützt"; }};
  var voice = null, last = "noch nichts abgespielt";

  function pick(){
    var vs = [];
    try{ vs = synth.getVoices() || []; }catch(e){ return; }
    vs = vs.filter(function(v){ return /^en/i.test(v.lang); });
    if(!vs.length) return;
    voice = vs.filter(function(v){ return /en[-_]GB/i.test(v.lang); })[0]
         || vs.filter(function(v){ return /en[-_]US/i.test(v.lang); })[0]
         || vs[0];
  }
  pick();
  if(synth.addEventListener) synth.addEventListener("voiceschanged", pick);

  return {
    available:true,
    status:function(){
      var n = 0;
      try{ n = (synth.getVoices() || []).length; }catch(e){}
      return n + " Stimmen geladen \u00b7 " + (voice ? "gewählt: " + voice.name + " (" + voice.lang + ")"
                                                    : "keine englische Stimme gefunden")
           + " \u00b7 zuletzt: " + last;
    },
    say:function(text, btn){
      try{
        if(synth.speaking || synth.pending){
          synth.cancel(); last = "abgebrochen";
          if(btn) btn.classList.remove("on");
          return;
        }
        if(!voice) pick();
        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = "en-GB";
        if(voice){ try{ u.voice = voice; u.lang = voice.lang || "en-GB"; }catch(e){} }
        u.rate = 0.85;
        last = "gestartet";
        u.onstart = function(){ last = "spricht"; };
        u.onend   = function(){ last = "fertig"; if(btn) btn.classList.remove("on"); };
        u.onerror = function(ev){
          last = "Fehler: " + ((ev && ev.error) ? ev.error : "unbekannt");
          if(btn) btn.classList.remove("on");
        };
        if(btn) btn.classList.add("on");
        synth.speak(u);
        if(synth.paused){ try{ synth.resume(); }catch(e){} }
      }catch(e){
        last = "Ausnahme: " + e.message;
        if(btn) btn.classList.remove("on");
      }
    }
  };
})();

var SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
  + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>'
  + '<path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>';

function speakBtn(text, label){
  if(!Speech.available) return "";
  return '<button class="speak" data-say="' + esc(text) + '" title="Aussprache anhören"'
    + ' aria-label="Aussprache von ' + esc(label || text) + ' anhören">' + SPK + '</button>';
}
/* Die drei Formen am Stueck: go - went - gone. Der Sprechrhythmus ist der
   halbe Lernweg, deshalb bekommt er einen eigenen Knopf. */
function chainText(v){
  return v.base + ", " + v.past.replace(" / ", " or ") + ", " + v.pp;
}

/* =========================================================================
   HILFSFUNKTIONEN
   ========================================================================= */
function shuffle(a){
  return a.map(function(x){ return [Math.random(), x]; })
          .sort(function(p,q){ return p[0]-q[0]; })
          .map(function(p){ return p[1]; });
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function normalise(s){
  return String(s).toLowerCase().trim()
    .replace(/^to\s+/,"").replace(/[.,;!?'"’]/g,"").replace(/\s+/g," ");
}
function distance(a,b){
  var m=a.length,n=b.length,d=[],i,j;
  for(i=0;i<=m;i++){ d[i]=[i]; }
  for(j=0;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++) for(j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
/* Zulaessige Nebenformen: burnt/burned usw. sind beide korrekt. */
function variants(target){
  var out = [], parts = [];
  String(target).split("/").forEach(function(part){
    var t = normalise(part);
    if(!t) return;
    parts.push(t);
    out.push(t);
    if(/nt$/.test(t))  out.push(t.replace(/nt$/, "ned"));
    if(/lt$/.test(t))  out.push(t.replace(/lt$/, "lled"));
    if(/ned$/.test(t)) out.push(t.replace(/ned$/, "nt"));
  });
  /* Bei Doppelformen wie "was / were" gilt auch die vollstaendige Nennung -
     in beliebiger Reihenfolge und mit Schraegstrich, Komma oder "or". */
  if(parts.length > 1){
    out.push(parts.join(" "));
    out.push(parts.slice().reverse().join(" "));
  }
  return out;
}
/* Trennzeichen zwischen Doppelformen vereinheitlichen, damit
   "was/were", "was / were", "was, were" und "was or were" gleich behandelt werden. */
function flatten(s){
  return String(s).replace(/\s*[\/,;&+]+\s*/g, " ")
                  .replace(/\s+or\s+/g, " ")
                  .replace(/\s+und\s+/g, " ")
                  .replace(/\s+/g, " ").trim();
}
function checkForm(input, target){
  var a = flatten(normalise(flatten(input)));
  if(!a) return "no";
  var vs = variants(target);
  if(vs.indexOf(a) !== -1) return "ok";
  for(var i=0;i<vs.length;i++){
    var tol = vs[i].length > 6 ? 2 : 1;
    if(distance(a, vs[i]) <= tol) return "near";
  }
  return "no";
}
function markGap(sentence, form){
  return esc(sentence).replace("___", '<b>' + esc(form) + '</b>');
}

var S = {
  view:"home", topicId:null,
  mode:"forms",          // forms | card | cloze
  showDe:true,
  onlyDue:true,
  queue:[], i:0, revealed:false, answered:null, landed:null, seen:0,
  clozeTense:null, res:null, justSafe:null, task:null
};
var view = document.getElementById("view");

/* =========================================================================
   STARTSEITE
   ========================================================================= */

  var groups = ["Portionen", "Muster", "Alles", "Grammatik"];
  var names = {
    "Portionen":"in Häppchen lernen",
    "Muster":"nach Bauart sortiert",
    "Alles":"alles zusammen",
    "Grammatik":"die Formen anwenden"
  };
  var h = "";

  var st = streakNow(), tc = todayCount();
  h += '<div class="streak' + (st ? "" : " cold") + '">'
     + '<div><div class="lab">Serie</div><div class="big">'
     + (st ? '<span class="flame">\u25CF</span> ' + st + (st === 1 ? " Tag" : " Tage")
           : "noch keine")
     + '</div></div>'
     + '<div class="right"><div class="lab">Heute \u00b7 Bestwert</div>'
     + '<div class="big">' + tc + ' \u00b7 ' + meta.best + '</div></div></div>';

  var earned = TOPICS.filter(function(t){ return isMastered(t.id); });
  h += '<div class="badges"><h3>Abzeichen \u00b7 ' + earned.length + ' von ' + TOPICS.length + '</h3>'
     + '<div class="badgegrid">'
     + TOPICS.map(function(t){
         var on = isMastered(t.id);
         return '<span class="badge' + (on?" on":"") + '">'
              + '<span class="m">' + (on ? "\u2713" : "\u25CB") + '</span>'
              + esc(t.name) + '</span>';
       }).join("")
     + '</div></div>';

  groups.forEach(function(g){
    h += '<section class="yeargroup"><div class="yearhead">'
       + '<span class="tag">' + esc(g.toUpperCase()) + '</span>'
       + '<span class="name">' + esc(names[g]) + '</span></div>';
    TOPICS.filter(function(t){ return t.group === g; }).forEach(function(t){
      var total = SETS[t.id].length;
      var due = dueCount(t.id);
      var c = boxCounts(t.id);
      var safe = c[4];
      var pct = total ? Math.round(safe/total*100) : 0;
      var done = isMastered(t.id);
      h += '<button class="topic" data-topic="' + t.id + '"' + (total?"":" disabled") + '>'
         + '<span class="t-row"><span class="t-name">' + esc(t.name)
         + (done ? ' <span class="seal">geschafft</span>' : "") + '</span>'
         + '<span class="t-count">' + (due ? '<span class="t-due">' + due + ' fällig</span> \u00b7 ' : "")
         + total + ' Verben</span></span>'
         + '<span class="bar"><i class="' + (done?"full":"") + '" style="width:' + pct + '%"></i></span>'
         + '<span class="t-prog"><span>' + safe + ' von ' + total + ' sicher</span>'
         + '<span>' + pct + ' %</span></span>'

    });
    h += '</section>';
  });

  h += '<div class="emptyhint">Ein Verb behält seinen Lernstand, egal über welches Set du '
     + 'es übst. Der Fortschritt bleibt auf diesem Gerät.</div>';

  h += '<button class="topic" id="allBtn" style="border-left-color:var(--petrol)">'
     + '<span class="t-row"><span class="t-name">Alle Verben nachschlagen</span>'
     + '<span class="t-count">' + V.length + ' Einträge</span></span></button>';

  view.innerHTML = h;

/* =========================================================================
   SITZUNG
   ========================================================================= */
/* Fuer den Grammatik-Modus wird zu jeder Karte ein neuer Satz gewuerfelt. */
function newTask(){
  S.clozeTense = Math.random() < 0.5 ? "sp" : "pp";
  var t = topicById(S.topicId);
  S.task = (t && t.mode === "neg" && S.queue.length && S.queue[S.i])
    ? buildNeg(S.queue[S.i], Math.random() < 0.55 ? "neg" : "q")
    : null;
}

function buildQueue(){
  var all = SETS[S.topicId];
  var pool = S.onlyDue ? all.filter(function(v){ return isDue(rec(v.id)); }) : all;
  S.queue = shuffle(pool.length ? pool : all);
  S.i = 0; S.revealed = false; S.answered = null; S.res = null;
  newTask();
}
function startSession(topicId){
  var t = topicById(topicId);
  S.topicId = topicId; S.view = "session"; S.seen = 0; S.onlyDue = true; S.justSafe = null;
  S.mode = (t && t.mode) ? t.mode : (S.mode === "neg" ? "forms" : S.mode);
  buildQueue(); render();
}
function current(){ return S.queue[S.i]; }

function formRow(label, form, ipa, showSpeak){
  return '<span class="lbl">' + label + '</span>'
       + '<span class="frm">' + esc(form)
       + (ipa ? '<span class="fipa">/' + esc(ipa) + '/</span>' : "")
       + '</span>'
       + (showSpeak ? speakBtn(form.replace(" / ", " ... "), form) : "<span></span>");
}

function answerForms(v){
  return '<div class="answer"><div class="forms">'
       + formRow("Grundform", v.base, v.ipaBase, true)
       + formRow("simple past", v.past, v.ipaPast, true)
       + formRow("past participle", v.pp, v.ipaPp, true)
       + '</div>'
       + (S.showDe ? '<div class="coll">' + esc(v.de) + '</div>' : "")
       + '<div class="chain"><span class="cw">' + esc(chainText(v)) + '</span>'
       + speakBtn(chainText(v), "alle drei Formen") + '</div>'
       + '</div>';
}

function renderSession(){
  if(!S.queue.length){
    view.innerHTML = '<div class="done"><h2>Keine Karten</h2>'
      + '<p>Dieses Set ist leer.</p><div class="controls">'
      + '<button class="primary" id="home">Übersicht</button></div></div>';
    document.getElementById("home").onclick = function(){ S.view="home"; render(); };
    return;
  }
  if(S.i >= S.queue.length){ renderDone(); return; }

  var v = current();
  var r = rec(v.id);
  var topic = TOPICS.filter(function(t){ return t.id === S.topicId; })[0];
  var counts = boxCounts(S.topicId);

  var rail = [1,2,3,4,5].map(function(n){
    var cls = (n===r.box?"here":"") + (S.landed===n?" land":"");
    return '<div class="slot ' + cls + '"><div class="n">FACH ' + n + '</div>'
         + '<div class="c">' + counts[n-1] + '</div>'
         + '<div class="iv">' + (n===1?"sofort":INTERVALS[n]+" d") + '</div></div>';
  }).join("");

  var toast = S.justSafe
    ? '<div class="toast"><span>\u2713</span><span>Sicher gelernt: <span class="m">'
      + esc(chainText(S.justSafe)) + '</span></span></div>'
    : "";

  var body = '<div class="eyebrow"><span>' + esc(topic.name) + '</span>'
           + '<span>' + (S.i+1) + ' / ' + S.queue.length + '</span></div>';

  if(S.mode === "card"){
    body += '<h2 class="prompt">' + esc(v.base) + '</h2>'
          + '<div class="pos">' + (S.showDe ? esc(v.de) : "Grundform") + '</div>'
          + '<div class="phon">'
          + (v.ipaBase ? '<span class="ipa">/' + esc(v.ipaBase) + '/</span>' : "")
          + speakBtn(v.base) + '</div>';
    if(S.revealed) body += answerForms(v);
    body += '<div class="spacer"></div>';
  }

  if(S.mode === "forms"){
    body += '<h2 class="prompt">' + esc(v.base) + '</h2>'
          + '<div class="pos">' + (S.showDe ? esc(v.de) : "Grundform") + '</div>'
          + '<div class="phon">'
          + (v.ipaBase ? '<span class="ipa">/' + esc(v.ipaBase) + '/</span>' : "")
          + speakBtn(v.base)
          + '<span class="typebadge">' + TYPE_MARK[v.type] + '</span></div>'
          + '<div class="twoin">'
          + '<div class="fld' + (S.res && S.res[0] === "no" ? " no" : "") + '">'
          + '<label for="in1">simple past</label>'
          + '<input id="in1" class="' + (S.res ? S.res[0] : "") + '" autocomplete="off" '
          + 'autocapitalize="off" spellcheck="false"' + (S.answered ? " disabled" : "") + '>'
          + (S.answered && S.res[0] !== "ok"
              ? '<div class="sol' + (S.res[0] === "no" ? " no" : "") + '">'
                + (S.res[0] === "no" ? "\u2717 richtig: " : "richtig: ")
                + '<b>' + esc(v.past) + '</b></div>' : "")
          + '</div>'
          + '<div class="fld' + (S.res && S.res[1] === "no" ? " no" : "") + '">'
          + '<label for="in2">past participle</label>'
          + '<input id="in2" class="' + (S.res ? S.res[1] : "") + '" autocomplete="off" '
          + 'autocapitalize="off" spellcheck="false"' + (S.answered ? " disabled" : "") + '>'
          + (S.answered && S.res[1] !== "ok"
              ? '<div class="sol' + (S.res[1] === "no" ? " no" : "") + '">'
                + (S.res[1] === "no" ? "\u2717 richtig: " : "richtig: ")
                + '<b>' + esc(v.pp) + '</b></div>' : "")
          + '</div></div>';
    if(S.answered) body += answerForms(v);
    body += '<div class="spacer"></div>';
  }

  if(S.mode === "neg"){
    var tk = S.task || buildNeg(v, "neg");
    var parts = tk.sentence.split("___");
    body += '<div class="cloze">'
          + esc(parts[0])
          + (S.answered ? '<b>' + esc(tk.solution) + '</b>' : '<span class="gap">?</span>')
          + esc(parts[1] || "")
          + '</div>'
          + '<div class="clue">'
          + (tk.kind === "neg" ? "verneinen" : "Frage bilden")
          + ' \u00b7 simple past'
          + (S.showDe ? ' \u00b7 ' + esc(v.de) : "") + '</div>'
          + '<div class="typebox"><input id="in1" placeholder="'
          + (tk.kind === "neg" ? "verneinte Form" : "Frageanfang")
          + '" autocomplete="off" autocapitalize="off" spellcheck="false"'
          + (S.answered ? " disabled" : "") + '>'
          + '<div class="verdict" id="verdict"></div></div>';
    if(S.answered) body += answerForms(v);
    body += '<div class="spacer"></div>';
  }

  if(S.mode === "cloze"){
    var isSp = S.clozeTense === "sp";
    var sent = isSp ? v.sSp : v.sPp;
    var target = isSp ? v.past : v.pp;
    body += '<div class="cloze">'
          + (S.answered ? markGap(sent, target)
                        : esc(sent).replace("___", '<span class="gap">?</span>'))
          + '</div>'
          + '<div class="clue">gesucht: <span>' + esc(v.base) + '</span> \u00b7 '
          + (isSp ? "simple past" : "past participle")
          + (S.showDe ? ' \u00b7 ' + esc(v.de) : "") + '</div>'
          + '<div class="typebox"><input id="in1" placeholder="fehlende Form" autocomplete="off" '
          + 'autocapitalize="off" spellcheck="false"' + (S.answered ? " disabled" : "") + '>'
          + '<div class="verdict" id="verdict"></div></div>';
    if(S.answered) body += answerForms(v);
    body += '<div class="spacer"></div>';
  }

  /* Wer getippt und danebengelegen hat, kann sich nicht selbst "Gewusst"
     geben. Bei einem blossen Tippfehler ("Fast") bleibt der Knopf da.
     In der Karteikarte gibt es keine Eingabe, dort bleibt alles offen. */
  var wrong = S.answered && S.res && S.res.indexOf("no") !== -1;
  var controls = (S.revealed || S.answered)
    ? '<button class="rate again" data-rate="0">Nochmal<span>1</span></button>'
    + '<button class="rate hard"  data-rate="1">Unsicher<span>2</span></button>'
    + (wrong ? ''
             : '<button class="rate good"  data-rate="2">Gewusst<span>3</span></button>')
    : (S.mode === "card"
        ? '<button class="primary" id="flip">Umdrehen <span style="opacity:.6">(Leertaste)</span></button>'
        : '<button class="primary" id="submit">Prüfen (Enter)</button>');

  view.innerHTML =
      '<div class="sessionbar">'
    +   '<button class="linkbtn" id="back">\u2190 Übersicht</button>'
    +   '<div class="switches">'
    +     (topic.mode ? '' :
          '<button class="switch" data-mode="forms" aria-pressed="' + (S.mode==="forms") + '">Formen tippen</button>'
    +     '<button class="switch" data-mode="card"  aria-pressed="' + (S.mode==="card")  + '">Karteikarte</button>'
    +     '<button class="switch" data-mode="cloze" aria-pressed="' + (S.mode==="cloze") + '">Lückensatz</button>')
    +     '<button class="switch" id="deBtn" aria-pressed="' + S.showDe + '">Deutsch</button>'
    +   '</div>'
    + '</div>'
    + toast
    + '<div class="rail">' + rail + '</div>'
    + '<div class="stage"><div class="vcard deal">' + body + '</div></div>'
    + '<div class="controls">' + controls + '</div>';

  bindSession();
  var inp = document.getElementById("in1");
  if(inp && !S.answered) inp.focus();
  if(S.res && S.res.indexOf("no") !== -1){
    var card = view.querySelector(".vcard");
    if(card){
      card.classList.add("shake");
      setTimeout(function(){ card.classList.remove("shake"); }, 320);
    }
  }
  updateFoot();
}

function bindSession(){
  document.getElementById("back").onclick = function(){ S.view="home"; render(); };

  Array.prototype.forEach.call(view.querySelectorAll("[data-mode]"), function(b){
    b.onclick = function(){
      S.mode = b.getAttribute("data-mode");
      S.revealed = false; S.answered = null; S.res = null;
      newTask();
      render();
    };
  });
  var de = document.getElementById("deBtn");
  if(de) de.onclick = function(){ S.showDe = !S.showDe; render(); };

  var flip = document.getElementById("flip");
  if(flip) flip.onclick = function(){ S.revealed = true; render(); };

  var sub = document.getElementById("submit");
  if(sub) sub.onclick = submitTyped;

  Array.prototype.forEach.call(view.querySelectorAll("[data-rate]"), function(b){
    b.onclick = function(){ rate(Number(b.getAttribute("data-rate"))); };
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-say]"), function(b){
    b.onclick = function(ev){ ev.stopPropagation(); Speech.say(b.getAttribute("data-say"), b); };
  });

  var i1 = document.getElementById("in1"), i2 = document.getElementById("in2");
  if(i1 && i2) i1.onkeydown = function(e){
    if(e.key === "Enter"){ e.preventDefault(); i2.focus(); }
  };
}

function submitTyped(){
  var v = current();
  if(S.mode === "forms"){
    var a = document.getElementById("in1"), b = document.getElementById("in2");
    if(!a || !b) return;
    S.res = [checkForm(a.value, v.past), checkForm(b.value, v.pp)];
    S.answered = true;
    var va = a.value, vb = b.value;
    render();
    var a2 = document.getElementById("in1"), b2 = document.getElementById("in2");
    if(a2) a2.value = va;
    if(b2) b2.value = vb;
    return;
  }
  var inp = document.getElementById("in1");
  if(!inp) return;

  if(S.mode === "neg"){
    var tk = S.task;
    var r0 = checkNeg(inp.value, tk.answers);
    S.answered = true; S.res = [r0];
    var typed = inp.value;
    render();
    var again = document.getElementById("in1");
    if(again) again.value = typed;
    var vd = document.getElementById("verdict");
    if(vd){
      vd.className = "verdict " + r0;
      vd.innerHTML = r0 === "ok"
        ? '<span class="mark">\u2713</span>Richtig.'
        : r0 === "near"
          ? '<span class="mark">\u2248</span>Fast \u2013 Schreibweise prüfen.'
            + '<span class="sol">' + esc(tk.solution) + '</span>'
          : '<span class="mark">\u2717</span>Falsch.'
            + (typed.trim() ? '<span class="yours">' + esc(typed.trim()) + '</span>' : "")
            + '<span class="sol">' + esc(tk.solution) + '</span>';
    }
    return;
  }

  var target = S.clozeTense === "sp" ? v.past : v.pp;
  var given = inp.value;
  var res = checkForm(inp.value, target);
  S.answered = true; S.res = [res];
  render();
  var el = document.getElementById("verdict");
  if(el){
    el.className = "verdict " + res;
    el.innerHTML = res === "ok"
      ? '<span class="mark">\u2713</span>Richtig.'
      : res === "near"
        ? '<span class="mark">\u2248</span>Fast \u2013 Schreibweise prüfen.'
          + '<span class="sol">' + esc(target) + '</span>'
        : '<span class="mark">\u2717</span>Falsch.'
          + (given.trim() ? '<span class="yours">' + esc(given.trim()) + '</span>' : "")
          + '<span class="sol">' + esc(target) + '</span>';
  }
}

function rate(quality){
  var v = current();
  var r = rec(v.id);
  var before = r.box;
  if(quality === 0)      r.box = 1;
  else if(quality === 1) r.box = Math.max(1, r.box - 1);
  else                   r.box = Math.min(5, r.box + 1);
  r.due = Date.now() + INTERVALS[r.box] * DAY;
  save();
  touchDay();
  S.justSafe = (r.box === 5 && before < 5) ? v : null;
  S.landed = r.box; S.seen++;
  S.i++; S.revealed = false; S.answered = null; S.res = null;
  newTask();
  render();
  setTimeout(function(){ S.landed = null; }, 500);
}

function renderDone(){
  var c = boxCounts(S.topicId);
  var total = SETS[S.topicId].length;
  view.innerHTML = '<div class="done"><h2>Durchgang beendet</h2>'
    + '<p>' + S.seen + ' Verben bearbeitet \u00b7 ' + c[4] + ' von ' + total + ' in Fach 5</p>'
    + '<div class="controls"><button class="primary" id="again">Weiter üben</button>'
    + '<button id="home">Übersicht</button></div></div>';
  document.getElementById("again").onclick = function(){
    S.onlyDue = false; buildQueue(); S.seen = 0; render();
  };
  document.getElementById("home").onclick = function(){ S.view="home"; render(); };
  updateFoot();
}

       + '<span><span class="lyear">' + TYPE_MARK[ty] + '</span>' + esc(TYPE_NAME[ty]) + '</span>'
       + '<span class="lnum">' + entries.length + '</span></summary><div class="lbody">'
       + '<div class="lhead"><span>Grundform</span><span>simple past</span>'
       + '<span>past participle</span><span>Deutsch</span></div>';
    entries.forEach(function(e){
      var hay = (e.base + " " + e.past + " " + e.pp + " " + e.de).toLowerCase();
      h += '<div class="vrow3" data-s="' + esc(hay) + '">'
         + '<span class="c1">' + esc(e.base)
         + (e.ipaBase ? '<span class="vipa">/' + esc(e.ipaBase) + '/</span>' : "") + '</span>'
         + '<span class="c2">' + esc(e.past)
         + (e.ipaPast ? '<span class="vipa">/' + esc(e.ipaPast) + '/</span>' : "") + '</span>'
         + '<span class="c3">' + esc(e.pp)
         + (e.ipaPp ? '<span class="vipa">/' + esc(e.ipaPp) + '/</span>' : "") + '</span>'
         + '<span class="vde">' + esc(e.de) + '</span>'
         + '</div>';
    });
    h += '</div></details>';
  });

  view.innerHTML =
      '<div class="sessionbar">'
    +   '<button class="linkbtn" id="lback">\u2190 Übersicht</button>'
    +   '<div class="switches">'
    +     '<button class="switch" id="lipa" aria-pressed="' + LIST_PREFS.ipa + '">Lautschrift</button>'
    +     '<button class="switch" id="lopen">Alle aufklappen</button>'
    +     '<button class="switch" id="lprint">Drucken</button>'
    +     '<button class="switch" id="lcsv">CSV</button>'
    +   '</div>'
    + '</div>'
    + '<div class="listctl"><input type="search" id="lq" '
    +   'placeholder="Suchen \u2013 Grundform, Form oder Bedeutung" '
    +   'autocomplete="off" autocapitalize="off" spellcheck="false"></div>'
    + '<div class="listcount" id="lcount">' + V.length + ' Verben in 4 Mustern \u00b7 Muster antippen zum Öffnen</div>'
    + '<div class="vlist" id="vlist">' + h + '</div>'
    + '<div class="noresult" id="lnone" hidden>Kein Treffer.</div>';

  var box = document.getElementById("vlist");
  applyListPrefs(box);

  document.getElementById("lback").onclick = function(){ S.view = "home"; render(); };
  document.getElementById("lipa").onclick = function(){
    LIST_PREFS.ipa = !LIST_PREFS.ipa;
    this.setAttribute("aria-pressed", LIST_PREFS.ipa);
    applyListPrefs(box);
  };
  document.getElementById("lopen").onclick = function(){
    var secs = box.querySelectorAll("details.lsec"), anyClosed = false, i;
    for(i=0;i<secs.length;i++){ if(!secs[i].open) anyClosed = true; }
    for(i=0;i<secs.length;i++){ secs[i].open = anyClosed; }
    this.textContent = anyClosed ? "Alle zuklappen" : "Alle aufklappen";
  };
  document.getElementById("lprint").onclick = function(){ try{ window.print(); }catch(e){} };
  document.getElementById("lcsv").onclick = function(){ exportCsv(box); };

  var q = document.getElementById("lq");
  q.oninput = function(){ filterList(box, q.value); };
  updateFoot();
}

function applyListPrefs(box){
  box.className = "vlist" + (LIST_PREFS.ipa ? "" : " hide-ipa");
}

function filterList(box, raw){
  var term = String(raw || "").toLowerCase().trim();
  var secs = box.querySelectorAll("details.lsec"), hits = 0, i, j;
  for(i=0;i<secs.length;i++){
    var rows = secs[i].querySelectorAll(".vrow3"), shown = 0;
    for(j=0;j<rows.length;j++){
      var match = !term || rows[j].getAttribute("data-s").indexOf(term) !== -1;
      rows[j].style.display = match ? "" : "none";
      if(match) shown++;
    }
    hits += shown;
    secs[i].className = "lsec" + (shown ? "" : " off");
    if(term) secs[i].open = shown > 0;
  }
  document.getElementById("lnone").hidden = !(term && hits === 0);
  document.getElementById("lcount").textContent = term
    ? hits + ' Treffer für \u201e' + raw.trim() + '\u201c'
    : V.length + " Verben in 4 Mustern \u00b7 Muster antippen zum Öffnen";
}

function exportCsv(box){
  var rows = [["Muster","Grundform","simple past","past participle","Deutsch",
               "Lautschrift Grundform","Beispiel simple past","Beispiel present perfect"].join("\t")];
  var n = 0;
  LIST_ORDER.forEach(function(ty){
    var sec = box.querySelector('details[data-sec="' + ty + '"]');
    if(!sec || sec.className.indexOf("off") !== -1) return;
    var domRows = sec.querySelectorAll(".vrow3");
    var entries = V.filter(function(v){ return v.type === ty; });
    entries.forEach(function(e, j){
      if(domRows[j] && domRows[j].style.display === "none") return;
      var cell = function(x){ return String(x == null ? "" : x).replace(/[\t\r\n]+/g, " "); };
      rows.push([TYPE_NAME[ty], e.base, e.past, e.pp, e.de, e.ipaBase,
                 e.sSp, e.sPp].map(cell).join("\t"));
      n++;
    });
  });
  if(!n){ alert("Nichts zu exportieren \u2013 die Suche liefert keine Treffer."); return; }
  try{
    var blob = new Blob(["\ufeff" + rows.join("\n")], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "irregular-verbs.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }catch(err){ alert("Der Export hat nicht funktioniert: " + err.message); }
}

document.addEventListener("keydown", function(e){
  if(S.view !== "session") return;
  var el = document.activeElement;
  var typing = el && (el.id === "in1" || el.id === "in2");
  if(typing && e.key === "Enter"){
    if(el.id === "in1" && document.getElementById("in2")) return;   // wird lokal behandelt
    e.preventDefault(); submitTyped(); return;
  }
  if(typing && !S.answered) return;
  if((e.key === "s" || e.key === "S") && current()){
    e.preventDefault(); Speech.say(chainText(current())); return;
  }
  if(e.key === " " && S.mode === "card" && !S.revealed){
    e.preventDefault(); S.revealed = true; render(); return;
  }
  if((S.revealed || S.answered) && ["1","2","3"].indexOf(e.key) !== -1){
    var blocked = S.answered && S.res && S.res.indexOf("no") !== -1;
    if(e.key === "3" && blocked){ e.preventDefault(); return; }
    e.preventDefault(); rate(Number(e.key) - 1);
  }
});

  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick = function(){
  document.getElementById("importFile").click();
};
document.getElementById("importFile").onchange = function(ev){
  var f = ev.target.files[0]; if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(fr.result);
      if(d && d.progress){                       /* neues Format */
        progress = d.progress;
        if(d.meta) meta = d.meta;
      }else{                                     /* aeltere Sicherung */
        progress = d;
      }
      save(); saveMeta(); render();
    }
    catch(e){ alert("Die Datei konnte nicht gelesen werden."); }
  };
  fr.readAsText(f);
};

function updateFoot(){
  var done = 0;
  V.forEach(function(v){ if(rec(v.id).box >= 3) done++; });
  document.getElementById("footstat").textContent = done + "/" + V.length + " SICHER";
}
